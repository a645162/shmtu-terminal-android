name: Build Android APK

# 触发条件：tag v* 推送 / 手动触发
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug/release)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: 安装 cmake/ninja/python3
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3-pip
          pip3 install requests

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            shmtu-terminal-android/.gradle
            shmtu-terminal-android/app/build
          key: ${{ runner.os }}-gradle-${{ hashFiles('shmtu-terminal-android/**/*.gradle*', 'shmtu-terminal-android/**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 注入 OAuth 客户端凭证到 local.properties
        run: |
          cat > shmtu-terminal-android/local.properties <<EOF
          ## CI 注入的 OAuth 客户端凭证 (由 GitHub Actions Secrets 提供)
          ## 用户在运行时也可以在 App 设置页面手动覆盖
          CLOUD_GDRIVE_CLIENT_ID=${{ secrets.CLOUD_GDRIVE_CLIENT_ID }}
          CLOUD_GDRIVE_CLIENT_SECRET=${{ secrets.CLOUD_GDRIVE_CLIENT_SECRET }}
          CLOUD_ONEDRIVE_CLIENT_ID=${{ secrets.CLOUD_ONEDRIVE_CLIENT_ID }}
          EOF
          echo "✓ 已生成 local.properties"
          echo "Client IDs 设置状态:"
          [ -n "${{ secrets.CLOUD_GDRIVE_CLIENT_ID }}" ] && echo "  Google Drive: ✓" || echo "  Google Drive: ⚠ 未配置"
          [ -n "${{ secrets.CLOUD_ONEDRIVE_CLIENT_ID }}" ] && echo "  OneDrive: ✓" || echo "  OneDrive: ⚠ 未配置"

      - name: 赋予 gradlew 执行权限
        run: chmod +x shmtu-terminal-android/gradlew

      - name: 编译 APK
        working-directory: shmtu-terminal-android
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.CLOUD_GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.CLOUD_GDRIVE_CLIENT_SECRET }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.CLOUD_ONEDRIVE_CLIENT_ID }}
        run: |
          BUILD_TYPE=${{ github.event.inputs.build_type || 'release' }}
          echo "构建类型: $BUILD_TYPE"
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          fi

      - name: 上传 APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shmtu-terminal-${{ github.event.inputs.build_type || 'release' }}-apk
          path: |
            shmtu-terminal-android/app/build/outputs/apk/${{ github.event.inputs.build_type || 'release' }}/**/*.apk
            shmtu-terminal-android/app/build/outputs/mapping/${{ github.event.inputs.build_type || 'release' }}/**/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: 显示 APK 信息
        if: success()
        run: |
          echo "=== 构建产物 ==="
          find shmtu-terminal-android/app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            shmtu-terminal-android/app/build/outputs/apk/release/*.apk
            shmtu-terminal-android/app/build/outputs/mapping/release/mapping.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# 使用说明：
# 1. 在 GitHub 仓库 Settings → Secrets and variables → Actions 中添加：
#    - CLOUD_GDRIVE_CLIENT_ID     (Google Cloud Console OAuth Client ID)
#    - CLOUD_GDRIVE_CLIENT_SECRET (Google Cloud Console OAuth Client Secret)
#    - CLOUD_ONEDRIVE_CLIENT_ID   (Azure Portal App Registration Client ID)
# 2. Secrets 缺失时编译仍然成功，OAuth provider 在 App 内显示"待配置"，
#    用户可在 App 设置页面手动输入 Client ID/Secret
# 3. tag v* 推送时自动构建 release APK 并发布 GitHub Release
# 4. 手动触发：Actions → Build Android APK → Run workflow
